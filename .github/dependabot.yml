# Weekly pull requests for outdated npm packages. Security fixes come as soon as GitHub knows
# about them (turn on "Dependabot security updates" under Settings → Code security).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint (used by `npm run lint`) supports TypeScript below 6.1 only. TypeScript 7
      # broke the lint check; remove this once typescript-eslint supports it.
      - dependency-name: typescript
        versions: [">=6.1"]
    groups:
      # One PR for all minor and patch bumps instead of one per package.
      minor-and-patch:
        update-types: [minor, patch]
